

{{ $active_tag = get:tag }}



{{ collection:articles sort="updated_at:desc" taxonomy:tags="{get:tag}" }}
  <a class="selected" href="{{ url }}">
    <div class="title">{{ title }}</div>

    {{ if tags }}
      <div class="tags">
        {{ tags }}
          <span class="tag">{{ title }}</span>
        {{ /tags }}
      </div>
    {{ /if }}
  </a>
{{ /collection:articles }}
