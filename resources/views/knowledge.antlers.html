<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge</title>
</head>
<body>
  <main>
    <h1>Knowledge</h1>
    {{ collection:articles sort="updated_at:desc" }}
      <article>
        <h2><a href="{{ url }}">{{ title }}</a></h2>
        {{ if summary }}
          <p>{{ summary }}</p>
        {{ /if }}
        {{ if para }}
          <p>Para: {{ para:title }}</p>
        {{ /if }}
        {{ if tags }}
          <p>Tags:
            {{ tags }}
              <span>{{ title }}</span>
            {{ /tags }}
          </p>
        {{ /if }}
      </article>
    {{ /collection:articles }}
  </main>
</body>
</html>
