title: Topic
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: icon
            field:
              type: icon
              display: icon
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: description
            field:
              type: markdown
              display: Description
              localizable: true
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              required: true
              validate:
                - required
                - 'max:200'
